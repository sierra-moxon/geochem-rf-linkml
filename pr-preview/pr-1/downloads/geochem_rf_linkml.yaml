slots:
  id:
    name: id
    definition_uri: https://w3id.org/sierra-moxon/geochem-rf-linkml/id
    description: A unique identifier for a thing.
    from_schema: https://w3id.org/sierra-moxon/geochem-rf-linkml
    mappings:
    - schema:identifier
    slot_uri: schema:identifier
    identifier: true
    owner: Dataset
    domain_of:
    - Attribute
    - Dataset
    range: uriorcurie
    required: true
  name:
    name: name
    definition_uri: https://w3id.org/sierra-moxon/geochem-rf-linkml/name
    description: A human-readable name for a thing.
    from_schema: https://w3id.org/sierra-moxon/geochem-rf-linkml
    mappings:
    - schema:name
    slot_uri: schema:name
    owner: Dataset
    domain_of:
    - Dataset
    range: string
  label:
    name: label
    definition_uri: https://w3id.org/sierra-moxon/geochem-rf-linkml/label
    description: Human-readable label for the attribute. Where available, the term
      name from the controlled vocabulary (CUAHSI/ODM2/BERVO).
    from_schema: https://w3id.org/sierra-moxon/geochem-rf-linkml
    mappings:
    - schema:name
    slot_uri: schema:name
    owner: Attribute
    domain_of:
    - Attribute
    range: string
    required: true
  definition:
    name: definition
    definition_uri: https://w3id.org/sierra-moxon/geochem-rf-linkml/definition
    description: Definition of the measured variable (Data Dictionary `definition`).
    from_schema: https://w3id.org/sierra-moxon/geochem-rf-linkml
    mappings:
    - schema:description
    slot_uri: schema:description
    owner: MeasurementVariable
    domain_of:
    - MeasurementVariable
    range: string
  column_or_row_name:
    name: column_or_row_name
    definition_uri: https://w3id.org/sierra-moxon/geochem-rf-linkml/column_or_row_name
