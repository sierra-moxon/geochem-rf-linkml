# Configuration of generators (defaults illustrated)
---
# The directory where the generated files are stored
# directory: "tmp"

# Only generate these serializations via gen-project.
# (The RDF/OWL schema serialization is produced by the dedicated `gen-owl`
#  call in the justfile `gen-project` recipe, because the owl generator cannot
#  create its own output directory when driven through this config file.)
includes:
  - excel
  - sqltable
  - jsonschema

# Set the arguments for the generators (no matter if they run or not)
generator_args:
  excel:
    mergeimports: true
  owl:
    mergeimports: true
    metaclasses: false
    type_objects: false
    add_root_classes: true
    mixins_as_expressions: true
  jsonschema:
    mergeimports: true
  sqltable:
    mergeimports: true

...
