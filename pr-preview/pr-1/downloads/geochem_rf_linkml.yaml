    from_schema: https://w3id.org/sierra-moxon/geochem-rf-linkml
    slot_uri: geochem_rf_linkml:column_or_row_name
    owner: MeasurementVariable
    domain_of:
    - MeasurementVariable
    range: string
  column_or_row_long_name:
    name: column_or_row_long_name
    definition_uri: https://w3id.org/sierra-moxon/geochem-rf-linkml/column_or_row_long_name
    description: Optional long-form name for the column/row.
    from_schema: https://w3id.org/sierra-moxon/geochem-rf-linkml
    slot_uri: geochem_rf_linkml:column_or_row_long_name
    owner: MeasurementVariable
    domain_of:
    - MeasurementVariable
    range: string
