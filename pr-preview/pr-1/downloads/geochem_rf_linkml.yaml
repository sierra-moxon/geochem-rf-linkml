        description: ISO 3534:2006-1 p-value.
        meaning: STATO:0000700
      CV:
        text: CV
        description: ISO 3534:2006-1 sample coefficient of variation.
      covariance:
        text: covariance
        description: ISO 3534:2006-1 sample covariance.
