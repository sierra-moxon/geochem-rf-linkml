    description: Temporal representation / interval (Data Dictionary `representation_temporal`).
    from_schema: https://w3id.org/sierra-moxon/geochem-rf-linkml
    slot_uri: geochem_rf_linkml:representation_temporal
    owner: MeasurementVariable
