classes:
  Attribute:
    name: Attribute
    definition_uri: https://w3id.org/sierra-moxon/geochem-rf-linkml/Attribute
    description: 'A domain, measurement, attribute, property, or descriptor for something
      measured. The identity of *what* is measured (the "bare concept", e.g. `temperature`).
      Mirrors the BERtron/NMDC Attribute pattern: a thin data-dictionary anchor whose
      `id` is a controlled-vocabulary CURIE.'
    from_schema: https://w3id.org/sierra-moxon/geochem-rf-linkml
    mappings:
    - nmdc:AttributeValue
    slots:
    - id
    - label
    class_uri: nmdc:AttributeValue
  MeasurementVariable:
    name: MeasurementVariable
    definition_uri: https://w3id.org/sierra-moxon/geochem-rf-linkml/MeasurementVariable
    description: 'A fully-qualified measured variable: the bare `Attribute` concept
      plus its unit and statistical/temporal qualifiers. One row of the ESS-DIVE Data
      Dictionary. This is the "variable dimension" of the star schema; the dimension
      business key is the qualified-identity tuple (see `unique_keys`), NOT the arbitrary
      user column name.'
    from_schema: https://w3id.org/sierra-moxon/geochem-rf-linkml
    is_a: Attribute
    slots:
    - label
    - MeasurementVariable_unit
    - unit_cv_id
    - MeasurementVariable_definition
    - data_type
    - unit_basis
    - missing_value_code
    - statistic_measurement
    - statistic_spatial
    - statistic_temporal
    - representation_temporal
    - lower_bound
    - upper_bound
    - column_or_row_name
    - column_or_row_long_name
    - MeasurementVariable_id
    slot_usage:
      id:
        name: id
        description: CURIE for the qualified variable (or its underlying CUAHSI/ODM2/BERVO
          term). Serves as the dimension key / foreign-key target.
        identifier: true
      unit:
        name: unit
        range: UnitEnum
        required: true
      definition:
        name: definition
        required: true
    class_uri: geochem_rf_linkml:MeasurementVariable
    unique_keys:
      variable_identity:
        unique_key_name: variable_identity
        unique_key_slots:
        - label
        - unit
        - unit_basis
        - statistic_measurement
        - statistic_spatial
        - statistic_temporal
        - representation_temporal
        description: 'dedups the conformed variable: two differently-named columns
          with the same qualified tuple are the SAME MeasurementVariable (attacks
          soil_ph vs soil_p_h).'
  Sample:
    name: Sample
    definition_uri: https://w3id.org/sierra-moxon/geochem-rf-linkml/Sample
    description: A physical sample (or a time point on a sample) that measurements
      are made on. The sample dimension of the star schema.
    from_schema: https://w3id.org/sierra-moxon/geochem-rf-linkml
    slots:
    - Sample_sample_name
    - datetime_collected
    - latitude
    - longitude
    - location_description
    slot_usage:
      sample_name:
        name: sample_name
        identifier: true
        required: true
    class_uri: geochem_rf_linkml:Sample
  Method:
    name: Method
    definition_uri: https://w3id.org/sierra-moxon/geochem-rf-linkml/Method
    description: 'One row of the Full "Methods & Attributes" file (`*_sample_attr.csv`):
      the method/flag/treatment/sensor definition referenced per-measurement.'
    from_schema: https://w3id.org/sierra-moxon/geochem-rf-linkml
    slots:
    - Method_attr_id
    - Method_attr_type
    - Method_attr_description
    - analysis_detection_limit
    - analysis_precision
    - instrument_precision
    - lower_bound
    - upper_bound
    - method_instrument
    - method_reference
    - method_hold_time
    - method_temp
    - method_light
    - method_atmosphere
    - method_moisture
    - method_medium
    - method_time
    - method_lab_contact
    - method_instrument_operator
    - method_lab
    slot_usage:
      attr_id:
        name: attr_id
        identifier: true
        required: true
      attr_type:
        name: attr_type
        range: AttrTypeEnum
        required: true
      attr_description:
        name: attr_description
        required: true
    class_uri: geochem_rf_linkml:Method
    unique_keys:
      attr_key:
        unique_key_name: attr_key
        unique_key_slots:
        - attr_id
        - attr_type
        description: Composite unique key from the Full RF.
  Measurement:
    name: Measurement
    definition_uri: https://w3id.org/sierra-moxon/geochem-rf-linkml/Measurement
    description: 'A single measured value: the "fact" of the star schema. Points at
      a `Sample` and a `MeasurementVariable` (and optionally a `Method`) by identifier,
      and carries the actual measure(s).'
    from_schema: https://w3id.org/sierra-moxon/geochem-rf-linkml
    slots:
    - Measurement_sample
    - Measurement_variable
    - Measurement_method
    - Measurement_numeric_value
    - string_value
    - datetime_value
    - raw_value
    - flag
    - treatment_id
    - datetime_measured
    - time_elapsed
    slot_usage:
      sample:
        name: sample
        range: Sample
        required: true
        inlined: false
      variable:
        name: variable
        range: MeasurementVariable
        required: true
        inlined: false
      method:
        name: method
        range: Method
        multivalued: true
        inlined: false
      numeric_value:
        name: numeric_value
        range: float
    class_uri: geochem_rf_linkml:Measurement
  Dataset:
    name: Dataset
    definition_uri: https://w3id.org/sierra-moxon/geochem-rf-linkml/Dataset
    description: 'A single ESS-DIVE sample-data package: the whole `Measurement` fact
      table plus the `MeasurementVariable` data-dictionary dimension (and the sample
      / method dimensions).'
    from_schema: https://w3id.org/sierra-moxon/geochem-rf-linkml
    slots:
    - id
    - name
    - Dataset_measurements
    - Dataset_variables
    - Dataset_samples
    - Dataset_methods
    slot_usage:
      measurements:
        name: measurements
        range: Measurement
        multivalued: true
        inlined_as_list: true
      variables:
        name: variables
        range: MeasurementVariable
        multivalued: true
        inlined_as_list: true
      samples:
        name: samples
        range: Sample
        multivalued: true
        inlined_as_list: true
      methods:
        name: methods
        range: Method
        multivalued: true
        inlined_as_list: true
    class_uri: geochem_rf_linkml:Dataset
    tree_root: true
